<span class="stufen" [attr.aria-label]="label()">
  @for (feld of felder(); track feld.stufe) {
    <span
      class="stufen__feld"
      [class.stufen__feld--aktiv]="stufe() >= feld.stufe"
      aria-hidden="true"
      >{{ feld.kuerzel }}</span
    >
  }
  <span class="stufen__text">{{ text() }}</span>
</span>
