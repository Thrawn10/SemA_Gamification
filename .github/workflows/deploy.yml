name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx ng test --no-watch
      - run: npx ng build --base-href /SemA_Gamification/
      # SPA fallback so deep links / page reloads work on Pages
      - run: cp dist/SemAPrototyp/browser/index.html dist/SemAPrototyp/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/SemAPrototyp/browser

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
